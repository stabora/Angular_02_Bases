<h3>Agregar: {{name()}} ({{power()}})</h3>

<input #txtName
    type="text"
    class="form-control"
    placeholder="Nombre"
    [value]="name()"
    (input)="name.set(txtName.value)"
>
<input #txtPower
    type="number"
    class="form-control mt-2"
    placeholder="Poder"
    [value]="power()"
    (input)="power.set(+txtPower.value)"
>
<button (click)="addCharacter()" class="mt-2 btn btn-primary">+</button>
